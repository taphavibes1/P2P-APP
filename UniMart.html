<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniMart – UNIBEN's P2P Marketplace</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body { background: linear-gradient(135deg,#d1fae5,#e5e7eb); min-height:100vh; display:flex; justify-content:center; font-family: system-ui,-apple-system,'Segoe UI',sans-serif; }
    #root { width:100%; display:flex; justify-content:center; align-items:flex-start; }
    ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:#1a6b3c40;border-radius:4px}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
    @keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(26,107,60,.4)}70%{box-shadow:0 0 0 10px rgba(26,107,60,0)}100%{box-shadow:0 0 0 0 rgba(26,107,60,0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    .fade-in{animation:fadeIn .3s ease forwards}
    .slide-up{animation:slideUp .35s ease forwards}
    .pulse-ring{animation:pulseRing 2s infinite}
    .spin{animation:spin .8s linear infinite}
    input,select,textarea,button{font-family:inherit}
    input:focus,select:focus,textarea:focus{border-color:#1a6b3c!important;outline:none}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const G = "#1a6b3c";
const BG = "#f0faf4";

const PRODUCTS = [
  { id:1,  emoji:"📚", title:"CHM 101 Textbook",        price:2500,  seller:"Adaeze N.",   distance:"~150m away", category:"Textbooks",     rating:4.8, condition:"Good",      description:"Chemistry 101 textbook, one semester use. All pages intact. Perfect for 100-level students." },
  { id:2,  emoji:"💡", title:"Reading Lamp",             price:3800,  seller:"Tunde B.",    distance:"~200m away", category:"Hostel Gear",   rating:4.5, condition:"Excellent", description:"USB-powered LED lamp. Adjustable neck, 3 brightness levels. Selling because I'm graduating." },
  { id:3,  emoji:"🍛", title:"Jollof Rice (plate)",      price:700,   seller:"Mama Ngozi",  distance:"~80m away",  category:"Food & Snacks", rating:4.9, condition:"Fresh",     description:"Party jollof with fried chicken and plantain. Made fresh daily. Order before 2pm." },
  { id:4,  emoji:"👕", title:"UNIBEN Hoodie",            price:8500,  seller:"Emeka O.",    distance:"~300m away", category:"Fashion",       rating:4.6, condition:"New",       description:"Official UNIBEN hoodie, navy blue, size L. Bought two by mistake. Tags still on." },

  { id:7,  emoji:"📖", title:"Biochem Practical Manual", price:1500,  seller:"Ngozi E.",    distance:"~180m away", category:"Textbooks",     rating:4.4, condition:"Good",      description:"BCH 305 Manual with all experiments. Minor pencil annotations, easily erasable." },
  { id:8,  emoji:"🩴", title:"Flip Flops (Size 42)",     price:900,   seller:"Kunle A.",    distance:"~90m away",  category:"Fashion",       rating:4.2, condition:"Good",      description:"Quality rubber flip flops, barely worn. Size 42. Great for hostel bathroom runs." },

const CATEGORIES = ["All","Textbooks","Hostel Gear","Food & Snacks","Fashion","Electronics"];
const DEMO_CHATS = {

  2:[{from:"buyer",text:"Hello, is the lamp USB powered?",time:"9:15 AM"},{from:"seller",text:"Yes! USB-C. Works on powerbank too 💡",time:"9:17 AM"},{from:"buyer",text:"How long is the neck?",time:"9:20 AM"},{from:"seller",text:"About 40cm, fully flexible. Great for night reading.",time:"9:22 AM"},{from:"buyer",text:"Perfect! Let's meet at the Main Gate safe zone.",time:"9:25 AM"}],
};
const DEFAULT_CHAT = [{from:"buyer",text:"Hi! Is this item still available?",time:"11:00 AM"},{from:"seller",text:"Yes, still available! Come and get it 😊",time:"11:02 AM"},{from:"buyer",text:"What condition is it in?",time:"11:04 AM"},{from:"seller",text:"Almost as good as new. You'll be satisfied!",time:"11:06 AM"},{from:"buyer",text:"Can we meet at the Main Gate safe zone?",time:"11:08 AM"}];
const PAY_METHODS = [
  {id:"card",    label:"Debit/Credit Card",  icon:"💳", desc:"Visa, Mastercard, Verve · Paystack"},
  {id:"transfer",label:"Bank Transfer",      icon:"🏦", desc:"GTBank, Access, Zenith & more"},
  {id:"ussd",    label:"USSD",               icon:"📱", desc:"Dial code from any phone"},
  {id:"qr",      label:"QR Code",            icon:"◼️", desc:"Scan with any banking app"},
  {id:"wallet",  label:"UniMart Wallet",     icon:"👛", desc:"Balance: ₦15,400"},

// ── Utility ──────────────────────────────────────────────────────────────
function Toast({message,onClose}){
  useEffect(()=>{const t=setTimeout(onClose,3000);return()=>clearTimeout(t)},[onClose]);
  return(
    <div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",zIndex:9999}} className="slide-up">
      <div style={{background:G,color:"#fff",padding:"12px 20px",borderRadius:16,boxShadow:"0 8px 32px rgba(26,107,60,.4)",fontSize:14,fontWeight:700,display:"flex",alignItems:"center",gap:8,whiteSpace:"nowrap"}}>
        ✓ {message}
      </div>
    </div>
  );
}
function Stars({r}){
  return <span style={{display:"flex",alignItems:"center",gap:2}}>
    {[1,2,3,4,5].map(i=><span key={i} style={{fontSize:11,color:i<=Math.floor(r)?"#facc15":"#d1d5db"}}>★</span>)}
    <span style={{fontSize:11,color:"#6b7280",marginLeft:2}}>{r}</span>
  </span>;
}
function Back({onBack}){
  return <button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",color:G,fontWeight:700,fontSize:22,lineHeight:1,padding:"0 4px"}}>‹</button>;
}
function EscrowBadge(){
  return <span style={{display:"inline-flex",alignItems:"center",gap:6,background:BG,border:"1px solid #bbf7d0",borderRadius:10,padding:"6px 12px",fontSize:12,color:G,fontWeight:700}}>🛡️ Protected by UniMart Escrow</span>;
}
function VBadge(){
  return <span style={{display:"inline-flex",alignItems:"center",gap:4,background:BG,border:"1px solid "+G,borderRadius:999,padding:"2px 8px",fontSize:10,color:G,fontWeight:800}}>✓ Verified</span>;
}
function QR({size=120}){
  const rows=9,cells=[];
  for(let r=0;r<rows;r++) for(let c=0;c<rows;c++){
    const corner=(r<3&&c<3)||(r<3&&c>=6)||(r>=6&&c<3);
    const dark=corner||((r+c*3+r*c)%3===0||(r*2+c)%5===1);
    cells.push(<div key={r+"-"+c} style={{width:size/rows,height:size/rows,background:dark?"#111":"#fff"}}/>);
  }
  return <div style={{border:"4px solid #111",borderRadius:8,display:"inline-flex",flexWrap:"wrap",width:size+8,height:size+8}}>{cells}</div>;
}
function Countdown({seconds:init}){
  const [s,setS]=useState(init);
  useEffect(()=>{if(s<=0)return;const t=setTimeout(()=>setS(x=>x-1),1000);return()=>clearTimeout(t)},[s]);
  return <span style={{fontFamily:"monospace",fontWeight:800,color:G,fontSize:20}}>{String(Math.floor(s/60)).padStart(2,"0")}:{String(s%60).padStart(2,"0")}</span>;
}

// ── Splash ────────────────────────────────────────────────────────────────

// ── Login ─────────────────────────────────────────────────────────────────

// ── Home Feed ─────────────────────────────────────────────────────────────

function Chat({p,go,toast}){

  const [offerOpen,setOfferOpen]=useState(false);
  const [offerVal,setOfferVal]=useState("");

  useEffect(()=>bottom.current?.scrollIntoView({behavior:"smooth"}),[msgs]);

  const send=()=>{
    if(!input.trim())return;
    const t=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    setMsgs(m=>[...m,{from:"buyer",text:input,time:t}]);setInput("");

      </div>
      <div style={{background:"#fffbeb",borderBottom:"1px solid #fde68a",padding:"8px 16px",display:"flex",alignItems:"center",gap:8}}>
        <span>📦</span><p style={{color:"#92400e",fontSize:11,fontWeight:700,margin:0}}>{p?.title} · ₦{p?.price?.toLocaleString()}</p>

  const ok=()=>{setStep("processing");setTimeout(()=>{setStep("success");toast("Payment Held in Escrow ✓");},2000);};

  if(step==="processing") return(
    <div className="fade-in" style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",background:BG,gap:20}}>
      <div style={{position:"relative",width:80,height:80}}>
        <div style={{position:"absolute",inset:0,border:"4px solid #e5e7eb",borderRadius:"50%"}}/>
        <div className="spin" style={{position:"absolute",inset:0,border:"4px solid transparent",borderTopColor:G,borderRadius:"50%"}}/>
      </div>
      <h3 style={{fontSize:20,fontWeight:900,margin:0}}>Processing Payment</h3>
      <p style={{fontSize:14,color:"#6b7280",margin:0}}>Securing funds in escrow...</p>
    </div>
  );
  if(step==="success") return(
    <div style={{display:"flex",flexDirection:"column",height:"100%",background:BG}}>
      <div style={{background:G,padding:"40px 20px 16px"}}><h2 style={{color:"#fff",fontWeight:700,fontSize:16,margin:0}}>Escrow Payment</h2></div>
      <div style={{flex:1,overflowY:"auto"}}>
        <PaySuccess p={p} ref_={ref_}/>
        <div style={{padding:"0 24px 32px"}}><button onClick={()=>go("home")} style={{width:"100%",background:G,color:"#fff",border:"none",borderRadius:20,padding:"15px 0",fontWeight:800,fontSize:14,cursor:"pointer"}}>Back to Home 🏠</button></div>
      </div>
    </div>
  );

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%",background:BG}}>
      <div style={{background:G,padding:"40px 20px 16px",display:"flex",alignItems:"center",gap:10}}>
        <Back onBack={step==="form"?()=>setStep("select"):()=>go("product",p)}/>
        <h2 style={{color:"#fff",fontWeight:700,fontSize:16,margin:0,flex:1}}>Escrow Payment</h2>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"16px",display:"flex",flexDirection:"column",gap:14}}>
        <div style={{background:"#fff",borderRadius:20,padding:16,border:"1px solid #f3f4f6"}}>
          <p style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:1,margin:"0 0 12px"}}>Order Summary</p>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{width:52,height:52,background:BG,borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,flexShrink:0}}>{p?.emoji}</div>
            <div><p style={{fontWeight:700,color:"#1f2937",fontSize:14,margin:"0 0 2px"}}>{p?.title}</p><p style={{color:G,fontWeight:900,fontSize:18,margin:0}}>₦{p?.price?.toLocaleString()}</p></div>
          </div>
          <div style={{marginTop:12,paddingTop:12,borderTop:"1px solid #f3f4f6",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <EscrowBadge/><span style={{fontSize:11,color:"#9ca3af"}}>+ ₦0 fee</span>
          </div>
        </div>
        {step==="select"&&<>
          <p style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:1,margin:"0 0 4px"}}>Choose Payment Method</p>
          {PAY_METHODS.map(m=>(
            <button key={m.id} onClick={()=>{setMethod(m.id);setStep("form");}} style={{width:"100%",background:"#fff",border:"2px solid #f3f4f6",borderRadius:20,padding:14,display:"flex",alignItems:"center",gap:14,cursor:"pointer",textAlign:"left",boxSizing:"border-box"}}>
              <span style={{fontSize:26,width:36,textAlign:"center"}}>{m.icon}</span>
              <div style={{flex:1}}><p style={{fontWeight:700,color:"#1f2937",fontSize:14,margin:"0 0 2px"}}>{m.label}</p><p style={{color:"#9ca3af",fontSize:11,margin:0}}>{m.desc}</p></div>
              <span style={{color:"#d1d5db",fontSize:18}}>›</span>
            </button>
          ))}
        </>}
        {step==="form"&&(
          <div className="slide-up" style={{background:"#fff",borderRadius:20,padding:20,border:"1px solid #f3f4f6"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
              <span style={{fontSize:22}}>{PAY_METHODS.find(m=>m.id===method)?.icon}</span>
              <p style={{fontWeight:700,color:"#1f2937",fontSize:15,margin:0}}>{PAY_METHODS.find(m=>m.id===method)?.label}</p>
            </div>
            {method==="card"&&<CardForm p={p} onOk={ok}/>}
            {method==="transfer"&&<TransferForm p={p} onOk={ok}/>}
            {method==="ussd"&&<USSDForm p={p} onOk={ok}/>}
            {method==="qr"&&<QRForm p={p} onOk={ok}/>}
            {method==="wallet"&&<WalletForm p={p} onOk={ok}/>}
            {method==="crypto"&&<CryptoForm p={p} onOk={ok}/>}
          </div>
        )}
        <div style={{height:16}}/>
      </div>
    </div>
  );
}

// ── Sell ──────────────────────────────────────────────────────────────────
function Sell({go,toast}){
  const [form,setForm]=useState({name:"",category:"Textbooks",price:"",description:""});
  const [photo,setPhoto]=useState(false);const [loading,setLoading]=useState(false);
  const inp={width:"100%",border:"2px solid #e5e7eb",borderRadius:14,padding:"12px 16px",fontSize:14,boxSizing:"border-box",background:"#fff"};
  return(
    <div className="fade-in" style={{display:"flex",flexDirection:"column",height:"100%",background:BG}}>
      <div style={{background:G,padding:"40px 20px 20px"}}>
        <h2 style={{color:"#fff",fontWeight:900,fontSize:22,margin:"0 0 4px"}}>Create Listing</h2>
        <p style={{color:"#86efac",fontSize:12,margin:0}}>Sell to students near you</p>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"20px",display:"flex",flexDirection:"column",gap:16}}>
        <div style={{display:"inline-flex",alignItems:"center",gap:8,background:"#dcfce7",border:"1px solid #86efac",borderRadius:999,padding:"6px 14px"}}>
          📍 <span style={{fontSize:12,fontWeight:700,color:"#15803d"}}>You're in Ugbowo Zone ✓</span>
        </div>
        <button onClick={()=>setPhoto(true)} style={{width:"100%",height:130,borderRadius:20,border:"2px dashed "+(photo?"#22c55e":"#d1d5db"),background:photo?"#f0fdf4":"#fff",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8,cursor:"pointer"}}>
          <span style={{fontSize:36,color:photo?undefined:"#d1d5db"}}>{photo?"📸":"📷"}</span>
          <p style={{fontSize:14,fontWeight:600,color:photo?"#16a34a":"#9ca3af",margin:0}}>{photo?"Photo Added ✓":"Tap to Upload Photo"}</p>
        </button>
        <div><label style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:1}}>Item Name *</label><input style={{...inp,marginTop:8}} placeholder="e.g. CHM 101 Textbook" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/></div>
        <div><label style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:1}}>Category *</label>
          <select style={{...inp,marginTop:8}} value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
            {CATEGORIES.filter(c=>c!=="All").map(c=><option key={c}>{c}</option>)}
          </select>
        </div>
        <div><label style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:1}}>Price (₦) *</label>
          <div style={{position:"relative",marginTop:8}}>
            <span style={{position:"absolute",left:16,top:"50%",transform:"translateY(-50%)",color:"#9ca3af",fontWeight:700}}>₦</span>
            <input type="number" style={{...inp,paddingLeft:32}} placeholder="0" value={form.price} onChange={e=>setForm(f=>({...f,price:e.target.value}))}/>
          </div>
        </div>
        <div><label style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:1}}>Description</label><textarea rows={4} style={{...inp,marginTop:8,resize:"none"}} placeholder="Describe condition, why selling..." value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))}/></div>
        <button onClick={()=>{if(!form.name||!form.price){toast("Fill name and price first");return;}setLoading(true);setTimeout(()=>{toast("Listing Live! 🎉");setLoading(false);go("home");},1500);}} disabled={loading} style={{width:"100%",background:G,color:"#fff",border:"none",borderRadius:20,padding:"16px 0",fontWeight:900,fontSize:16,cursor:loading?"not-allowed":"pointer",opacity:loading?.7:1,boxShadow:"0 4px 20px rgba(26,107,60,.3)"}}>
          {loading?"Posting...":"Post Listing 🚀"}
        </button>
        <div style={{height:16}}/>
      </div>
    </div>
  );
}

// ── Profile ───────────────────────────────────────────────────────────────

        <h2 style={{color:"#fff",fontSize:20,fontWeight:900,margin:"0 0 4px"}}>Chukwuemeka Obi</h2>

              <button onClick={()=>go("sell")} style={{background:BG,border:"1px solid #bbf7d0",color:G,borderRadius:999,padding:"5px 14px",fontSize:12,fontWeight:700,cursor:"pointer"}}>+ New</button>

// ── Bottom Nav ────────────────────────────────────────────────────────────
function BottomNav({screen,go}){
  if(["splash","login"].includes(screen))return null;
  const tabs=[["home","🏠","Home"],["sell","➕","Sell"],["chat","💬","Chat"],["profile","👤","Profile"]];
  return(
    <div style={{background:"#fff",borderTop:"1px solid #f3f4f6",display:"flex"}}>
      {tabs.map(([id,icon,label])=>(
        <button key={id} onClick={()=>go(id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",padding:"10px 0 8px",gap:2,border:"none",background:"none",cursor:"pointer",color:screen===id?G:"#9ca3af"}}>
          <span style={{fontSize:20}}>{icon}</span>
          <span style={{fontSize:10,fontWeight:700}}>{label}</span>
          {screen===id&&<div style={{width:4,height:4,background:G,borderRadius:"50%"}}/>}
        </button>
      ))}
    </div>
  );
}

// ── Root ──────────────────────────────────────────────────────────────────
function App(){
  const [screen,setScreen]=useState("splash");
  const [product,setProduct]=useState(null);
  const [toast,setToast]=useState(null);
  const tk=useRef(0);
  const showToast=msg=>{tk.current++;setToast({msg,key:tk.current});};
  const go=(s,p=null)=>{if(p)setProduct(p);setScreen(s);};

  const render=()=>{
    switch(screen){
      case "splash":   return <Splash go={go}/>;
      case "login":    return <Login go={go} toast={showToast}/>;
      case "home":     return <Home go={go} toast={showToast}/>;
      case "product":  return <Product p={product} go={go} toast={showToast}/>;
      case "chat":     return <Chat p={product} go={go} toast={showToast}/>;
      case "payment":  return <Payment p={product} go={go} toast={showToast}/>;
      case "sell":     return <Sell go={go} toast={showToast}/>;
      case "profile":  return <Profile go={go} toast={showToast}/>;
      default:         return <Home go={go} toast={showToast}/>;
    }
  };

  return(
    <div style={{display:"flex",justifyContent:"center",alignItems:"flex-start",minHeight:"100vh",background:"linear-gradient(135deg,#d1fae5,#e5e7eb)"}}>
      {toast&&<Toast key={toast.key} message={toast.msg} onClose={()=>setToast(null)}/>}
      <div style={{width:"100%",maxWidth:420,minHeight:"100vh",background:"#fff",display:"flex",flexDirection:"column",boxShadow:"0 30px 80px rgba(0,0,0,.25)",position:"relative",overflow:"hidden"}}>
        <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>{render()}</div>
        <BottomNav screen={screen} go={go}/>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
